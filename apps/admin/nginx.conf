server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src has no 'unsafe-inline'/'unsafe-eval' -- that's the actual XSS
    # backstop. The one inline <script> this app ships (index.html's FOUC-safe
    # dark-mode class toggle, applied before first paint) is allow-listed by
    # exact sha256 hash instead -- recompute and update this hash if that
    # script's contents ever change, or it silently stops running again (it
    # was found broken this way in prod: CSP was blocking it outright, so
    # every fresh load flashed light theme before React's own JS took over).
    # style-src needs 'unsafe-inline' because both this app's own inline
    # style={{...}} usage and the Google Maps widget's injected control styles
    # rely on it; retrofitting nonces for style-src alone isn't worth the risk
    # of breaking the map widget blind. fonts.googleapis.com/fonts.gstatic.com
    # are the Maps widget's own font stylesheet + font files, not something
    # this app requests itself. Origins here are the real ones this app talks
    # to: mechbazar.com (API, same origin as this panel in prod -- see
    # docker-compose.yml's VITE_SERVER_ORIGIN), Google Maps/Places (store/
    # rider location pickers -- maps.googleapis.com serves the actual tile/
    # static-map imagery, not just the JS SDK, so it has to be in img-src too,
    # not only script-src; missing that silently broke every map preview,
    # e.g. Mechanics' location cards showing "we have no imagery"), Firebase
    # Auth (mech-bazar-8fd86), storage.googleapis.com (product/vendor images
    # -- POST /upload stores to Firebase Storage when a bucket is configured,
    # the live default; missing this origin silently broke every such image
    # -- a CSP violation, not a real 404 -- e.g. Dashboard's Top Selling
    # Products), cdn.jsdelivr.net (emoji-picker-react's default emoji
    # image CDN, used on the Categories/Service Categories pages), and
    # images.unsplash.com (Banners & CMS's seeded demo banners link
    # directly to Unsplash stock photos; missing this origin is why every
    # banner card showed a broken image with its title/badge overlapping
    # a blank grey box instead of the actual banner image), and
    # static.vecteezy.com (Categories.tsx's icon field intentionally accepts
    # either an emoji or an arbitrary pasted image URL -- cat.icon?.startsWith
    # ('http') renders it as an <img>; an admin had pasted a vecteezy stock
    # icon there, and it silently CSP-broke same as the other two above).
    # This is the same bug class recurring a 4th time now (see also the
    # vendor panel's equivalent CSP, which was missing maps.googleapis.com
    # entirely) -- any admin-pasted external image URL will keep breaking
    # here until these flows route through the app's own upload/storage
    # instead of accepting raw third-party URLs; flagged, not fixed here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4U007stGS2bzLOsHwBKcYYOpWfH4nH9QABdiD0GTyqA=' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com https://maps.googleapis.com https://storage.googleapis.com https://cdn.jsdelivr.net https://images.unsplash.com https://static.vecteezy.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Belt-and-braces: this build doesn't emit .map files today (vite.config.ts
    # has no sourcemap setting, which defaults to off), but a future dependency
    # bump or config change could re-enable them without anyone noticing --
    # deny at the hosting layer too rather than relying solely on the build
    # config staying correct.
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # Hashed, immutable build output (Vite's assets/** filenames embed a
    # content hash) -- safe to cache for a year since a new deploy always
    # produces new filenames. Mirrors apps/mobile/nginx.conf.
    #
    # nginx gotcha: add_header directives are inherited from the parent
    # context ONLY if the current context defines none of its own -- so
    # every security header set at the server level above has to be repeated
    # here verbatim, or this location would silently stop sending CSP/
    # X-Frame-Options/etc entirely.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4U007stGS2bzLOsHwBKcYYOpWfH4nH9QABdiD0GTyqA=' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com https://maps.googleapis.com https://storage.googleapis.com https://cdn.jsdelivr.net https://images.unsplash.com https://static.vecteezy.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (and any other unhashed file) must always be revalidated so
    # a new deploy's hashed bundle reference is picked up immediately -- with
    # no explicit Cache-Control here, browsers may serve a stale cached
    # index.html indefinitely (heuristic caching from a prior visit) and never
    # even request the new build. Found live 2026-08-11: a Dashboard fix was
    # deployed and confirmed present in the served bundle, but kept appearing
    # "not fixed" because of exactly this. Same add_header-inheritance gotcha
    # as /assets/ above applies here too.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4U007stGS2bzLOsHwBKcYYOpWfH4nH9QABdiD0GTyqA=' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com https://maps.googleapis.com https://storage.googleapis.com https://cdn.jsdelivr.net https://images.unsplash.com https://static.vecteezy.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
