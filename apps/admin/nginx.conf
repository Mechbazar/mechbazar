server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src has no 'unsafe-inline'/'unsafe-eval' -- that's the actual XSS
    # backstop. style-src needs 'unsafe-inline' because both this app's own
    # inline style={{...}} usage and the Google Maps widget's injected control
    # styles rely on it; retrofitting nonces for style-src alone isn't worth
    # the risk of breaking the map widget blind. Origins here are the real
    # ones this app talks to: mechbazar.com (API, same origin as this panel in
    # prod -- see docker-compose.yml's VITE_SERVER_ORIGIN), Google Maps/Places
    # (store/rider location pickers), Firebase Auth (mech-bazar-8fd86),
    # storage.googleapis.com (product/vendor images -- POST /upload stores to
    # Firebase Storage when a bucket is configured, the live default; missing
    # this origin silently broke every such image -- a CSP violation, not a
    # real 404 -- e.g. Dashboard's Top Selling Products), and cdn.jsdelivr.net
    # (emoji-picker-react's default emoji image CDN, used on the Categories/
    # Service Categories pages).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com https://storage.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data:; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Belt-and-braces: this build doesn't emit .map files today (vite.config.ts
    # has no sourcemap setting, which defaults to off), but a future dependency
    # bump or config change could re-enable them without anyone noticing --
    # deny at the hosting layer too rather than relying solely on the build
    # config staying correct.
    location ~* \.map$ {
        deny all;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
