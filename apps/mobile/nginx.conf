gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    application/x-font-ttf;

server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hashed, immutable build output (Expo's _expo/static/** and asset
    # filenames all embed a content hash) -- safe to cache for a year since a
    # new deploy always produces new filenames.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Expo web export can emit .map files alongside the JS bundle -- deny them
    # at the hosting layer so an un-minified, comment-bearing source tree is
    # never fetchable just by guessing the bundle's own filename + ".map".
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # Universal Links (iOS) / App Links (Android) verification files. Expo's
    # public/ dir (apps/mobile/public/.well-known/) is copied verbatim into
    # this image's web export, but apple-app-site-association has no file
    # extension -- without an explicit type here nginx would serve it with
    # whatever default_type is configured, which iOS's verifier may reject.
    location /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # index.html (and any other unhashed file) must always be revalidated so
    # a new deploy's hashed bundle reference is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
