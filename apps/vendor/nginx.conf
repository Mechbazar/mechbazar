server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src has no 'unsafe-inline'/'unsafe-eval' -- that's the actual XSS
    # backstop. style-src needs 'unsafe-inline' because both this app's own
    # inline style={{...}} usage and the Google Maps/Places widget's injected
    # control styles rely on it; retrofitting nonces for style-src alone isn't
    # worth the risk of breaking the store-location picker blind. Origins here
    # are the real ones this app talks to: mechbazar.com (API, same origin as
    # this panel in prod -- see docker-compose.yml's VITE_SERVER_ORIGIN),
    # Google Maps/Places (Register.tsx business step, Profile.tsx store info),
    # and Firebase Auth (mech-bazar-8fd86).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com; font-src 'self' data:; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # vite.config.ts no longer sets build.sourcemap, so this build shouldn't
    # emit .map files -- deny at the hosting layer too as a backstop, in case
    # that setting (or a dependency that ships its own .map) ever changes.
    location ~* \.map$ {
        deny all;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
