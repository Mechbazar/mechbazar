server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src has no 'unsafe-inline'/'unsafe-eval' -- that's the actual XSS
    # backstop. The one inline <script> this app ships (index.html's FOUC-safe
    # dark-mode class toggle, applied before first paint) is allow-listed by
    # exact sha256 hash instead -- recompute and update this hash if that
    # script's contents ever change, or it silently stops running again (this
    # exact failure mode was caught live on the admin panel's equivalent CSP).
    # style-src needs 'unsafe-inline' because both this app's own inline
    # style={{...}} usage and the Google Maps/Places widget's injected
    # control styles rely on it; retrofitting nonces for style-src alone isn't
    # worth the risk of breaking the store-location picker blind. Origins here
    # are the real ones this app talks to: mechbazar.com (API, same origin as
    # this panel in prod -- see docker-compose.yml's VITE_SERVER_ORIGIN),
    # Google Maps/Places (Register.tsx business step, Profile.tsx store info),
    # Firebase Auth (mech-bazar-8fd86), and storage.googleapis.com (product
    # images -- POST /upload stores to Firebase Storage when a bucket is
    # configured, the live default; missing this origin silently breaks every
    # such image as a CSP violation rather than a real 404 -- caught this gap
    # live on the admin panel's equivalent CSP, fixed there and here together).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mg6+JImMgCRR7QFmJNKE5WchJShXsvlV3AWtAy7H9So=' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mechbazar.com https://maps.gstatic.com https://maps.google.com https://storage.googleapis.com; font-src 'self' data:; connect-src 'self' https://mechbazar.com wss://mechbazar.com https://*.googleapis.com; frame-src https://mech-bazar-8fd86.firebaseapp.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # vite.config.ts no longer sets build.sourcemap, so this build shouldn't
    # emit .map files -- deny at the hosting layer too as a backstop, in case
    # that setting (or a dependency that ships its own .map) ever changes.
    location ~* \.map$ {
        deny all;
        return 404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
