version: '3.8'
services:
  backend:
    build:
      context: ./apps/backend
    container_name: mechbazar_backend
    # Postgres runs natively on the VPS host, not in a container -- `localhost`
    # inside this container refers to the container itself, not the host, so
    # DATABASE_URL must target this alias instead (see apps/backend/.env.example).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Bound to loopback only: Nginx (on the host) is the sole public entry
      # point (proxies to 127.0.0.1:5005 -- see deploy/nginx/mechbazar). With
      # no VPS firewall in front of this VM, publishing on 0.0.0.0 would let
      # anyone reach the API directly over plain HTTP, bypassing TLS entirely.
      - 127.0.0.1:5005:5005
    environment:
      - PORT=5005
      - NODE_ENV=production
    volumes:
      - ./apps/backend/uploads:/app/uploads
    networks:
      - mechbazar_net
    env_file:
      - ./apps/backend/.env
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: https://mechbazar.com/api
        VITE_SERVER_ORIGIN: https://mechbazar.com
        # Public client identifiers (not secrets), same Firebase project as
        # apps/mobile and the backend Admin SDK -- see apps/admin/.env.example.
        VITE_FIREBASE_API_KEY: AIzaSyDGfDIni8X8FQyroo-KonEfbJQuHBV0nKk
        VITE_FIREBASE_AUTH_DOMAIN: mech-bazar-8fd86.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: mech-bazar-8fd86
        VITE_FIREBASE_STORAGE_BUCKET: mech-bazar-8fd86.firebasestorage.app
        VITE_FIREBASE_MESSAGING_SENDER_ID: "42514698096"
        VITE_FIREBASE_APP_ID: "1:42514698096:web:2da09e89e77068173149b5"
    container_name: mechbazar_admin
    ports:
      # Loopback only -- see the backend service's port comment above.
      - 127.0.0.1:3000:80
    networks:
      - mechbazar_net
    restart: unless-stopped
  vendor:
    build:
      context: .
      dockerfile: apps/vendor/Dockerfile
      args:
        VITE_API_URL: https://mechbazar.com/api
        VITE_SERVER_ORIGIN: https://mechbazar.com
        # Public client identifiers (not secrets), same Firebase project as
        # apps/mobile and the backend Admin SDK -- see apps/vendor/.env.example.
        VITE_FIREBASE_API_KEY: AIzaSyDGfDIni8X8FQyroo-KonEfbJQuHBV0nKk
        VITE_FIREBASE_AUTH_DOMAIN: mech-bazar-8fd86.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: mech-bazar-8fd86
        VITE_FIREBASE_STORAGE_BUCKET: mech-bazar-8fd86.firebasestorage.app
        VITE_FIREBASE_MESSAGING_SENDER_ID: "42514698096"
        VITE_FIREBASE_APP_ID: "1:42514698096:web:2da09e89e77068173149b5"
        # Google Maps JavaScript API + Places API key for the store-location
        # picker (Register.tsx business step, Profile.tsx store info) --
        # same sourcing convention as the mobile service's Maps key above.
        # Missing/empty degrades gracefully to a plain address form.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: mechbazar_vendor
    ports:
      # Loopback only -- see the backend service's port comment above.
      - 127.0.0.1:3001:80
    networks:
      - mechbazar_net
    restart: unless-stopped
  mobile:
    build:
      context: ./apps/mobile
      args:
        EXPO_PUBLIC_API_URL: https://mechbazar.com/api
        EXPO_PUBLIC_FIREBASE_VAPID_KEY: BKzZ31SGSXlgFaHsazwM9jXwmNqoUUrNfEAA1WJiQle7kipWHVcWi2fyiEhYfHTCJusQWynxPWJQ1wggAHLNjak
        # Unlike the Firebase keys above, this IS a secret (it must stay
        # unrestricted-by-referrer for the web build, unlike the
        # referrer-restricted key a browser-only deployment could otherwise
        # use safely) -- sourced from a root .env (gitignored, see
        # .env.example), never hardcoded here. Set it on the VPS before
        # `docker compose up -d --build`.
        EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: mechbazar_mobile
    ports:
      # Loopback only -- see the backend service's port comment above.
      - 127.0.0.1:3002:80
    networks:
      - mechbazar_net
    restart: unless-stopped
networks:
  mechbazar_net: null
